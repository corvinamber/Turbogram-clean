name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        working-directory: app
        run: |
          npm install
          mkdir -p www && cp index.html www/
          npx cap add android
          npx cap sync android

      - name: Add POST_NOTIFICATIONS permission (Android 13, 14, 15)
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST" || { echo "::error::Не найден $MANIFEST"; exit 1; }
          if grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            echo "Разрешение POST_NOTIFICATIONS уже есть в манифесте"
          else
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST" || { echo "::error::Не удалось добавить POST_NOTIFICATIONS"; exit 1; }
          grep -n 'POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'capacitor-local-notifications' android/capacitor.settings.gradle \
            && echo "Плагин @capacitor/local-notifications подключён к Android-проекту" \
            || echo "::warning::Плагин local-notifications не найден в capacitor.settings.gradle"
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: turbogram-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
