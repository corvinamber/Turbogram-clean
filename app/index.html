<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbogram</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3390ec">
<style>
:root{--pan:#fff;--pan2:#f5f7fb;--hov:#f0f2f6;--tx:#0e1621;--mu:#7b8696;--ac:#2f7ff0;--ac1:#52aaff;--ac2:#2c78e8;--in:#fff;--intx:#0e1621;--out1:#56adff;--out2:#2f7ff0;--bd:rgba(14,22,33,.09);--glass:rgba(255,255,255,.82);--card:#fff;--chat:linear-gradient(180deg,#e7eef8 0%,#dee8f4 55%,#d6e2f1 100%);--sh1:0 1px 2px rgba(14,22,33,.08),0 6px 18px rgba(14,22,33,.06);--sh2:0 18px 50px rgba(14,22,33,.28);--scrim:rgba(8,14,24,.45);--dh1:#56adff;--dh2:#2c6fe0;--swoff:#d3d8e0;--qin:rgba(47,127,240,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pan:#151d28;--pan2:#111923;--hov:#1f2a37;--tx:#e9eff7;--mu:#8795a8;--ac:#4d9dff;--ac1:#5aa9ff;--ac2:#3a82ee;--in:#1f2a37;--intx:#e9eff7;--out1:#3f86f2;--out2:#2b62cf;--bd:rgba(255,255,255,.08);--glass:rgba(21,29,40,.82);--card:#1b2531;--chat:linear-gradient(180deg,#0b121b 0%,#0e1722 60%,#101b28 100%);--sh1:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);--sh2:0 18px 50px rgba(0,0,0,.6);--scrim:rgba(2,6,12,.62);--dh1:#2a5da8;--dh2:#1b3a6b;--swoff:#3a4656;--qin:rgba(77,157,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--pan:#151d28;--pan2:#111923;--hov:#1f2a37;--tx:#e9eff7;--mu:#8795a8;--ac:#4d9dff;--ac1:#5aa9ff;--ac2:#3a82ee;--in:#1f2a37;--intx:#e9eff7;--out1:#3f86f2;--out2:#2b62cf;--bd:rgba(255,255,255,.08);--glass:rgba(21,29,40,.82);--card:#1b2531;--chat:linear-gradient(180deg,#0b121b 0%,#0e1722 60%,#101b28 100%);--sh1:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);--sh2:0 18px 50px rgba(0,0,0,.6);--scrim:rgba(2,6,12,.62);--dh1:#2a5da8;--dh2:#1b3a6b;--swoff:#3a4656;--qin:rgba(77,157,255,.14);color-scheme:dark}
*{-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
html,body{height:100%;margin:0;background:var(--pan)}
body{color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes slidein{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fl{0%,70%{box-shadow:0 0 0 3px var(--ac),var(--sh1)}100%{box-shadow:var(--sh1)}}
#app{display:flex;height:100%}
#side{width:340px;flex:none;display:flex;flex-direction:column;background:var(--pan);border-right:1px solid var(--bd)}
#pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px;box-sizing:border-box}
.top .burger{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:14px;font-size:24px;line-height:1;color:var(--mu);cursor:pointer;padding:0;transition:background .15s,color .15s,transform .1s}
.top .burger:hover{background:var(--hov);color:var(--ac)}.top .burger:active{transform:scale(.92)}
#q{flex:1;min-width:0;height:44px;box-sizing:border-box;background:var(--hov);border:1px solid transparent;border-radius:22px;padding:0 18px;color:var(--tx);font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--qin)}#q::placeholder{color:var(--mu)}
#list{overflow-y:auto;flex:1;padding:2px 8px 14px}
.it{display:flex;gap:12px;padding:10px;min-height:64px;box-sizing:border-box;border-radius:18px;cursor:pointer;align-items:center;transition:background .15s,transform .1s;margin-bottom:2px}
.it:hover{background:var(--hov)}.it:active{transform:scale(.985)}
.it.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;box-shadow:0 6px 18px rgba(47,127,240,.3)}.it.on .mu{color:rgba(255,255,255,.85)}
.av{position:relative;overflow:hidden;width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:21px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:36px;height:36px;font-size:16px;box-shadow:none}.av.xl{width:104px;height:104px;font-size:44px;box-shadow:0 6px 22px rgba(0,0,0,.22)}
.it .b{flex:1;min-width:0}.it .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:13px}.it .pv{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .r>.pv{min-width:0}
.sec{color:var(--ac);font-weight:600;font-size:13px;letter-spacing:.2px;padding:14px 10px 4px}
.bd2{background:var(--ac);color:#fff;border-radius:11px;min-width:22px;height:22px;line-height:22px;padding:0 7px;box-sizing:border-box;text-align:center;font-size:12px;font-weight:600;flex:none}
.hd{display:flex;align-items:center;gap:6px;padding:0 14px 0 6px;height:58px;box-sizing:border-box;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--bd)}
.hd .t{font-weight:600;font-size:16.5px}.hd .back{display:none;width:44px;height:44px;align-items:center;justify-content:center;font-size:34px;line-height:1;background:none;border:0;border-radius:14px;color:var(--ac);cursor:pointer;padding:0 0 4px;transition:background .15s}
.hd .back:active{background:var(--hov)}
.hdc{display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding:4px 6px;border-radius:14px;transition:background .15s}
#hav .av{width:42px;height:42px;font-size:18px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 12px 8px}
main.vin{animation:viewin .26s ease-out}
.sep{text-align:center;margin:14px 0 8px}.sep span{background:rgba(14,22,33,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:14px;padding:4px 13px;font-size:12.5px;font-weight:500}
.row{display:flex;margin:3px 0;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.bub{position:relative;max-width:min(80%,540px);background:var(--in);color:var(--intx);padding:8px 13px 6px;border-radius:20px;overflow-wrap:anywhere;font-size:15.5px;line-height:1.38;box-shadow:var(--sh1);cursor:pointer;transition:transform .12s}
.bub:active{transform:scale(.985)}
.row:not(.me) .bub{border-bottom-left-radius:6px}
.row.me .bub{background:linear-gradient(145deg,var(--out1),var(--out2));color:#fff;border-bottom-right-radius:6px}
.row.flash .bub{animation:fl 1.4s}
.who{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:1px;cursor:pointer}
.ts{float:right;margin:7px 0 0 12px;font-size:11px;color:var(--mu)}.row.me .ts{color:rgba(255,255,255,.78)}
.quote{border-left:3px solid var(--ac);padding:5px 10px;margin:1px 0 6px;border-radius:4px 10px 10px 4px;background:var(--qin);cursor:pointer;font-size:13px}
.quote b{display:block;color:var(--ac);font-weight:600}
.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
.row.me .quote{background:rgba(255,255,255,.17);border-left-color:rgba(255,255,255,.9)}.row.me .quote b{color:#fff}.row.me .quote span{color:rgba(255,255,255,.85)}
.bub.gift{text-align:center;padding:16px 24px;max-width:270px;background:linear-gradient(135deg,#7c6cf0,#c26bdb);color:#fff;border-radius:22px}
.gift .e{font-size:58px;line-height:1.1}.gift .ts{float:none;display:block;color:rgba(255,255,255,.8)}
.row .bub.gift2,.row.me .bub.gift2{background:var(--card);color:var(--tx);padding:10px;min-width:236px;max-width:290px;border-radius:22px;box-shadow:var(--sh1),0 0 0 1px var(--bd)}
.gift2 .gh{font-size:13px;font-weight:600;margin:2px 4px 8px;color:var(--mu)}.row.me .gift2 .ts{color:var(--mu)}
.gift2 .quote b{color:var(--ac)}.row.me .gift2 .quote{background:var(--qin);border-left-color:var(--ac)}.row.me .gift2 .quote span{color:var(--mu)}
.gc{background:linear-gradient(160deg,rgba(124,108,240,.18),rgba(255,126,179,.18));border:1px solid rgba(124,108,240,.26);border-radius:18px;padding:16px 14px;text-align:center}
.gc .e{font-size:58px;line-height:1.1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}.gc .gn{font-weight:700;font-size:16px;margin-top:4px}
.gc .gm{display:inline-block;margin-top:6px;padding:3px 11px;border-radius:12px;background:rgba(124,108,240,.16);color:var(--tx);font-size:12.5px;font-weight:600}
.gc .gnote{font-style:italic;margin-top:8px;font-size:14px}.gc .gfrom{font-size:11.5px;color:var(--mu);margin-top:6px}
.note{background:rgba(14,22,33,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:16px;padding:7px 14px;margin:10px auto;font-size:13px;max-width:fit-content;text-align:center}
.card{background:var(--card);border-radius:22px;padding:18px;margin:0 auto 14px;max-width:640px;box-shadow:var(--sh1)}
.card h2{margin:0 0 10px;font-size:18px;font-weight:700}.card .note{background:none;color:var(--mu);padding:0;margin:0;-webkit-backdrop-filter:none;backdrop-filter:none;max-width:none}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;max-width:640px;margin:0 auto 14px}
.sg{background:var(--card);border-radius:22px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .18s}
.sg:hover{transform:translateY(-2px);box-shadow:var(--sh1),0 10px 26px rgba(14,22,33,.12)}
.sg .e{font-size:52px;line-height:1.1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.16))}.sg .gn{font-weight:600}.sg .pr{font-weight:700;font-size:16px}
.sg .lf{font-size:13px;color:var(--mu)}.sg .lf.low{color:#ef4444;font-weight:600}.sg button{margin-top:auto}.sg.out{opacity:.6}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pgrid .gc{padding:10px 8px}.pgrid .gc .e{font-size:38px}.pgrid .gc .gn{font-size:13.5px}
.bal{font-size:15px;margin-bottom:10px}.bal b{font-size:24px;font-weight:700}
.dbal{display:inline-block;width:fit-content;margin-top:4px;padding:4px 13px;border-radius:14px;background:rgba(255,255,255,.2);font-size:15px;font-weight:600}
.fld{margin:8px 0}.fld label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:5px}.fld input,.fld select{width:100%;box-sizing:border-box}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--tx)}label.chk input{width:22px;height:22px;accent-color:var(--ac)}
.fr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0}.fr>*{flex:1 1 130px}.fr>.fld{flex:1 1 130px;margin:0}
.crow{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}.crow:first-of-type{border-top:0}.crow .t{flex:1;min-width:0}.crow .mu{font-size:12.5px}
input.f,select,.sheet textarea{font-size:16px;color:var(--tx);background:var(--hov);border:1px solid transparent;border-radius:14px;min-height:48px;padding:0 14px;box-sizing:border-box;min-width:0;outline:0;transition:border-color .15s,box-shadow .15s,background .15s}
input.f:focus,select:focus,.sheet textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--qin)}
input.f::placeholder,.sheet textarea::placeholder{color:var(--mu)}
.sheet textarea{width:100%;resize:none;height:92px;padding:12px 14px;line-height:1.4}
select{appearance:auto}
button.p{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;box-sizing:border-box;border:0;border-radius:14px;background:linear-gradient(180deg,var(--ac1),var(--ac2));color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;box-shadow:0 5px 16px rgba(47,127,240,.32);transition:transform .1s,filter .15s,opacity .15s}
button.p:hover{filter:brightness(1.05)}button.p:active{transform:scale(.97)}button.p:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none;filter:none}
button.p.w,button.g2.w{width:100%}
button.g2{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;box-sizing:border-box;border:0;border-radius:14px;background:var(--hov);color:var(--tx);font-size:15.5px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
button.g2:active{transform:scale(.97)}
button.s{min-height:40px;padding:0 12px;background:none;border:0;border-radius:12px;color:var(--mu);cursor:pointer;font-size:13.5px;flex:none;transition:background .15s,color .15s}
button.s:hover{background:var(--hov);color:var(--tx)}
#emo{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:28px;cursor:pointer;animation:sheetup .2s ease-out}
#emo span{padding:4px 6px;border-radius:12px;transition:background .12s,transform .1s}#emo span:hover{background:var(--hov)}#emo span:active{transform:scale(.88)}
#rbar{display:flex;align-items:center;gap:8px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8px 12px;border-top:1px solid var(--bd);animation:sheetup .2s ease-out}
#rbar .qq{flex:1;min-width:0;border-left:3px solid var(--ac);padding:2px 0 2px 10px;font-size:13.5px}
#rbar b{display:block;color:var(--ac)}#rbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
#rbar button{width:40px;height:40px;padding:0;font-size:18px;border-radius:50%}
footer{padding:8px 10px 10px;display:flex;gap:8px;align-items:flex-end}
.box{flex:1;display:flex;align-items:center;gap:2px;min-height:48px;background:var(--pan);border-radius:24px;padding:0 6px 0 8px;box-shadow:var(--sh1)}
.box input{flex:1;border:0;background:none;color:var(--tx);font-size:16px;padding:13px 6px;outline:0;min-width:0}.box input::placeholder{color:var(--mu)}
.box button{width:40px;height:40px;flex:none;background:none;border:0;border-radius:50%;font-size:24px;line-height:1;cursor:pointer;color:var(--mu);padding:0;transition:background .12s,color .12s}
.box button:hover{background:var(--hov);color:var(--ac)}
#send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--ac1),var(--ac2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 5px 16px rgba(47,127,240,.4);transition:transform .1s}
#send:active{transform:scale(.9)}
.menu{position:fixed;z-index:15;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh2);padding:6px;display:flex;flex-direction:column;min-width:210px;max-width:280px;animation:popin .15s ease-out}
.menu button{min-height:46px;background:none;border:0;color:var(--tx);font-size:15.5px;text-align:left;padding:0 14px;border-radius:12px;cursor:pointer;transition:background .12s}
.menu button:hover,.menu button:active{background:var(--hov)}.menu .danger{color:#ef4444}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,28,40,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:22px;padding:11px 18px;z-index:30;font-size:14.5px;max-width:90%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.35);animation:toastin .24s ease-out}
#dov{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:24;animation:fadein .25s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--pan);z-index:25;transform:translateX(-104%);transition:transform .32s cubic-bezier(.22,1,.36,1),box-shadow .32s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;overflow-y:auto}
#drawer.on{transform:none;box-shadow:12px 0 48px rgba(0,0,0,.35)}
.dh{padding:26px 20px 18px;display:flex;flex-direction:column;gap:5px;background:linear-gradient(145deg,var(--dh1),var(--dh2));color:#fff}
.dh .av{width:68px;height:68px;font-size:28px;margin-bottom:6px;box-shadow:0 4px 16px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.35)}
.dh .n{font-weight:700;font-size:20px;letter-spacing:-.2px}.dh .b{font-size:13.5px;color:rgba(255,255,255,.85)}
.dit{display:flex;gap:14px;padding:0 20px;min-height:56px;cursor:pointer;align-items:center;background:none;border:0;color:var(--tx);font-size:16px;width:100%;text-align:left;transition:background .15s}
.dit:hover,.dit:active{background:var(--hov)}.dit.red{color:#ef4444}
.dit .ic{font-size:20px;width:26px;text-align:center}.dit .lbl{flex:1}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--swoff);flex:none;transition:background .25s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.22,1,.36,1)}
.sw.on{background:#34c759}.sw.on i{transform:translateX(20px)}
.dft{margin-top:auto;padding:16px 20px;color:var(--mu);font-size:12.5px}
#auth{position:fixed;inset:0;z-index:20;background:var(--chat);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto}
.ac{background:var(--card);border-radius:28px;padding:30px 24px 24px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh2);animation:sheetup .4s cubic-bezier(.22,1,.36,1)}
.ac h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.8px;text-align:center;background:linear-gradient(135deg,var(--ac1),#8b6cf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ac p{margin:0;text-align:center}.ac .err{color:#ef4444;min-height:18px;font-size:13.5px;text-align:center}
#sov{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:26;display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s}
.sheet{position:relative;background:var(--card);width:min(100%,440px);border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh2);animation:sheetup .34s cubic-bezier(.22,1,.36,1)}
.sheet::before{content:"";flex:none;width:42px;height:5px;border-radius:3px;background:var(--bd);align-self:center;margin-bottom:6px}
.sh-x{position:absolute;right:12px;top:12px;width:36px;height:36px;padding:0!important;min-height:0!important;border-radius:50%!important;background:var(--hov)!important;font-size:16px!important;display:flex;align-items:center;justify-content:center}
.sheet h2{margin:0;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.3px}.sheet p{margin:0}
.sheet label{font-size:13px;font-weight:500;color:var(--mu)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.avw{position:relative;display:flex;flex:none}
.odot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#34c759;border:2.5px solid var(--pan);box-sizing:border-box}
.odot.sm{width:12px;height:12px;border-width:2px}.odot.big{width:22px;height:22px;border-width:3.5px;right:3px;bottom:3px}
.it.on .odot{border-color:var(--ac2)}
.hd .mu.online,.sheet .seen.online{color:#34c759;font-weight:600}.hd .mu.typing{color:var(--ac);font-weight:500}
.td{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-left:3px;vertical-align:middle;animation:tdot 1.2s infinite ease-in-out}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
.sheet .seen{text-align:center;color:var(--mu);font-size:14px;margin-top:-6px}
.sheet .badge-ban{align-self:center;background:rgba(239,68,68,.14);color:#ef4444;font-weight:600;font-size:13px;padding:4px 12px;border-radius:12px}
button.g2.danger{color:#ef4444}
#nbar{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);font-size:14.5px;animation:sheetup .2s ease-out}
#nbar .nt{flex:1;min-width:0}#nbar button{min-height:42px;padding:0 16px;flex:none}
.nft{position:relative;overflow:hidden;border-radius:18px;padding:30px 12px 12px;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.42);background:linear-gradient(160deg,#7c6cf0,#e56fb0);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.nft>*{position:relative}
.nft>.pat{position:absolute;inset:-25%;font-size:20px;line-height:1.75;letter-spacing:7px;opacity:.17;transform:rotate(-14deg);overflow:hidden;word-break:break-all;pointer-events:none;user-select:none;text-shadow:none}
.nft>.bdg{position:absolute;top:8px;right:10px;font-size:19px}
.nft>.rib{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:9px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;text-shadow:none}
.nft .e{font-size:58px;line-height:1.15;margin-top:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.nft .gn{font-weight:700;font-size:16px;margin-top:2px}
.nft .num{display:inline-block;margin:5px 0 2px;padding:2px 11px;border-radius:10px;background:rgba(0,0,0,.3);font-size:12.5px;font-weight:700}
.nft .trow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;margin-top:5px;text-align:left;background:rgba(0,0,0,.26);border-radius:10px;padding:4px 6px 4px 9px;text-shadow:none}
.nft .trow .tk{grid-column:1;grid-row:1;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;opacity:.72}.nft .trow .tv{grid-column:1;grid-row:2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700}.nft .trow .tr{grid-column:2;grid-row:1/3}
.nft .gnote{font-style:italic;margin-top:8px;font-size:13.5px}.nft .gfrom{font-size:11.5px;opacity:.8;margin-top:6px}
.nft.legend::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.38) 50%,transparent 68%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.tr{flex:none;font-weight:700;font-size:12px;border-radius:8px;padding:1px 8px;color:#fff;text-shadow:none}
.t1{background:#e6a800;color:#2b1d00!important}.t2{background:#9333ea}.t3{background:#2563eb}.t4{background:#16a34a}.t5{background:#6b7280}
.icell{display:flex;flex-direction:column;gap:6px}.icell .gfrom{font-size:12px;color:var(--mu);text-align:center}
.icell .lst{font-size:13px;font-weight:600;text-align:center;color:var(--ac)}
.lform{display:flex;flex-direction:column;gap:6px}.lform .fr{gap:6px}.lform .fr>*{flex:1 1 0}
.seg{display:flex;gap:4px;background:var(--hov);border-radius:16px;padding:4px;max-width:640px;margin:0 auto 14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:none;color:var(--mu);font-size:15.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh1)}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;max-width:760px;margin:0 auto 14px}
.mk{background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .18s}
.mk:hover{transform:translateY(-2px);box-shadow:var(--sh1),0 10px 26px rgba(14,22,33,.14)}
.mk button.p,.mk button.g2,.icell button.p,.icell button.g2{padding:0 8px;font-size:14.5px;white-space:nowrap}
.mk-s{font-size:13px;color:var(--mu);text-align:center}.mk-p{font-size:20px;font-weight:800;text-align:center}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;cursor:pointer;padding:0}
.card details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.oh{margin:12px 0 4px;font-weight:700;font-size:12.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.orow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}.orow .on{flex:1}.osw{width:34px;height:18px;border-radius:6px;flex:none}
.row.sys{justify-content:center;margin:8px 0}
.bub.sysb{max-width:min(88%,320px);cursor:default;background:var(--card);color:var(--tx);padding:10px;border-radius:22px;text-align:center;box-shadow:var(--sh1),0 0 0 1px var(--bd)}
.bub.sysb:active{transform:none}.sysb .sh{font-size:13.5px;font-weight:600;margin:2px 4px 9px;line-height:1.35}
.sysb .ts{float:none;display:block;text-align:center;margin:7px 0 0;color:var(--mu)}
[hidden]{display:none!important}

<body>
<div id="auth"><div class="ac"><p class="mu">Подключение…</p></div></div>
<div id="app">
<aside id="side"><div class="top"><button class="burger" id="burger" title="Меню">☰</button><input id="q" placeholder="Поиск по нику" autocomplete="off"></div><div id="list"></div></aside>
<section id="pane">
<div class="hd"><button class="back" id="back">‹</button><div class="hdc" id="hdc"><div id="hav"></div><div><div class="t" id="ht"></div><div class="mu" id="hs"></div></div></div></div>
<main id="main"></main>
<div id="emo" hidden></div>
<div id="nbar" hidden></div>
<div id="rbar" hidden></div>
<footer id="comp"><div class="box"><button id="emb" title="Эмодзи">☺</button><input id="inp" placeholder="Написать сообщение…" maxlength="1000" autocomplete="off"></div><button id="send" title="Отправить"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-6.8l11-1.7-11-1.7V3.5L22 12z"/></svg></button></footer>
</section>
</div>
<div id="dov" hidden></div>
<aside id="drawer"></aside>
<div id="sov" hidden><div class="sheet" id="sheet"></div></div>
<div class="menu" id="menu" hidden></div><div class="toast" id="toast" hidden></div>
<script>
const S={market:[],catalog:null,shopTab:"shop",mkSort:"new",lst:null,oddsOpen:false,typing:{},blocked:{},banned:{},isBanned:false,coins:0,lastDaily:0,armed:"",dirty:false,preview:false,U:{},view:"chat",open:false,q:"",reply:null,msgs:[],dms:[],read:{},gifts:[],members:[],recv:{},nick:{},me:null,owner:false,auth:"load",mode:"login",err:"",form:{emoji:"🎁",name:"",price:"",supply:"",cnick:"",camt:"",to:"",note:"",free:false}};
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function nm(id){return S.nick[id]||"Участник"}
function ini(id){const n=S.nick[id];return n?n[0].toUpperCase():"?"}
function tm(ts){try{return new Date(ts).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function dy(ts){const d=new Date(ts),n=new Date(),y=new Date(n-864e5);if(d.toDateString()===n.toDateString())return"Сегодня";if(d.toDateString()===y.toDateString())return"Вчера";return d.toLocaleDateString("ru",{day:"numeric",month:"long"})}
function pl(n,a,b,c){const m=n%10,h=n%100;return n+" "+(m==1&&h!=11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c))}
function hs(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function av(id,txt,sm,bg){
  const d=el("div","av"+(sm?" s":""),txt);d.style.background=bg||`hsl(${hs(id)%360} 50% 48%)`;
  const u=S.U[id];
  if(u&&u.av&&!bg){const i=new Image();i.alt="";i.onerror=()=>i.remove();i.src=BASE+"/api/avatar/"+id+"?v="+u.av;d.appendChild(i)}
  return d;
}
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const isApp=!!window.Capacitor;
let BASE=ls.get("srv")||(isApp?"":location.origin),TOKEN=ls.get("tok"),es=null;
async function api(p,b){
  const r=await fetch(BASE+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,token:TOKEN})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||("Ошибка "+r.status));e.status=r.status;e.data=j;throw e}
  return j;
}
function thread(u){return S.dms.filter(m=>m.from===u||m.to===u)}
function unread(u){const r=S.read[u]||0;return S.dms.filter(m=>m.from===u&&m.ts>r).length}
function side(){
  const l=$("#list");l.textContent="";
  const last=S.msgs[S.msgs.length-1],mine=(S.recv[S.me]||[]).length;
  let pv="Нет сообщений";
  if(last)pv=last.type==="gift"?"🎁 "+last.gname:(last.uid===S.me?"Вы: ":nm(last.uid)+": ")+(last.text||"");
  const sys=[{k:"chat",c:"#3390ec",ic:"💬",t:"Общий чат",pv,tm:last?tm(last.ts):""},{k:"shop",c:"#e17076",ic:"🎁",t:"Магазин подарков",pv:"Баланс: "+fmt(S.coins)+" 🪙"}];
  if(S.owner)sys.push({k:"admin",c:"#7bc862",ic:"⚙",t:"Админ",pv:"Подарки и монеты"});
  const q=S.q.trim().toLowerCase();let n=0;
  const add=i=>{
    n++;const d=el("div","it"+(S.view===i.k?" on":""));
    d.appendChild(i.uid?avOn(i.uid):av(i.k,i.ic,0,i.c));
    const b=el("div","b"),r=el("div","r");r.appendChild(el("div","t",i.t));r.appendChild(el("div","mu",i.tm||""));b.appendChild(r);
    const r2=el("div","r");r2.appendChild(el("div","mu pv",i.pv));if(i.un&&S.view!==i.k)r2.appendChild(el("div","bd2",String(i.un)));
    b.appendChild(r2);d.appendChild(b);
    d.onclick=()=>{S.view=i.k;S.open=true;if(i.uid){S.q="";$("#q").value=""}render(true)};l.appendChild(d);
  };
  sys.filter(i=>!q||i.t.toLowerCase().includes(q)).forEach(add);
  const dial={};S.dms.forEach(m=>{const o=m.from===S.me?m.to:m.from;if(!dial[o]||m.ts>=dial[o].ts)dial[o]=m});
  const U=id=>{const d=dial[id];return{k:"dm:"+id,uid:id,t:nm(id),pv:S.typing[id]?"печатает…":d?(d.from===S.me?"Вы: ":"")+d.text:"Написать сообщение",tm:d?tm(d.ts):"",un:unread(id)}};
  if(!q){Object.keys(dial).sort((a,b)=>dial[b].ts-dial[a].ts).forEach(id=>add(U(id)))}
  else{
    const f=S.members.filter(id=>id!==S.me&&nm(id).toLowerCase().includes(q));
    if(f.length){l.appendChild(el("div","sec","Пользователи"));f.forEach(id=>add(U(id)))}
    if(!n)l.appendChild(el("div","sec","Никого не найдено"));
  }
}
function head(){
  let T;if(S.view.startsWith("dm:")){const id=S.view.slice(3);T=[ini(id),`hsl(${hs(id)%360} 50% 48%)`,nm(id),"личные сообщения"]}else T={chat:["💬","#3390ec","Общий чат",pl(S.members.length,"участник","участника","участников")],shop:["🎁","#e17076",S.shopTab==="market"?"Маркет подарков":"Магазин подарков",S.shopTab==="market"?"Лотов: "+S.market.length+" · баланс "+fmt(S.coins)+" 🪙":"Баланс: "+fmt(S.coins)+" 🪙"],admin:["⚙","#7bc862","Админ","Только для владельца"]}[S.view];
  const dmId=S.view.startsWith("dm:")?S.view.slice(3):null;
  const a=$("#hav");a.textContent="";a.appendChild(dmId?avOn(dmId,1):av("h",T[0],1,T[1]));$("#ht").textContent=T[2];setHs(dmId,T[3]);
  const hc=$("#hdc");hc.style.cursor=dmId?"pointer":"default";hc.onclick=dmId?()=>openProfile(dmId):null;
}
function chat(m,list,dm){
  if(S.err)m.appendChild(el("div","note",S.err));
  if(!list.length)m.appendChild(el("div","note",dm?"Диалог пока пуст. Напишите первым!":"Пока пусто. Напишите первое сообщение!"));
  let pd="",pu=null;
  list.forEach(x=>{
    const d=dy(x.ts);if(d!==pd){const s=el("div","sep");s.appendChild(el("span","",d));m.appendChild(s);pd=d;pu=null}
    if(x.type==="trade"&&x.gift){
      const rs=el("div","row sys"),bs=el("div","bub sysb");rs.dataset.id=x.id;
      bs.appendChild(el("div","sh",tradeText(x.gift)));bs.appendChild(gcard(x.gift));bs.appendChild(el("span","ts",tm(x.ts)));
      rs.appendChild(bs);m.appendChild(rs);pu=null;return;
    }
    const me=x.uid===S.me,r=el("div","row"+(me?" me":""));r.dataset.id=x.id;
    if(!me&&!dm)r.appendChild(pu===x.uid&&x.type!=="gift"?el("div","av s"):pav(x.uid));
    const b=el("div","bub");
    if(!me&&!dm&&pu!==x.uid){const w=el("div","who",nm(x.uid));w.onclick=e=>{e.stopPropagation();openProfile(x.uid)};b.appendChild(w)}
    if(x.reply){const q=el("div","quote");q.appendChild(el("b","",x.reply.uid===S.me?"Вы":nm(x.reply.uid)));q.appendChild(el("span","",x.reply.text||"…"));q.onclick=e=>{e.stopPropagation();jump(x.reply.id)};b.appendChild(q)}
    if(x.type==="giftcard"&&x.gift){b.classList.add("gift2");b.appendChild(el("div","gh",me?"🎁 Вы отправили подарок":"🎁 "+nm(x.uid)+" дарит вам подарок"));b.appendChild(gcard(x.gift))}
    else if(x.type==="gift"){b.classList.add("gift");b.appendChild(el("div","e",x.emoji||"🎁"));b.appendChild(el("div","",nm(x.uid)+" дарит «"+(x.gname||"")+"» · "+nm(x.to)))}
    else b.appendChild(el("span","",x.text||""));
    b.appendChild(el("span","ts",tm(x.ts)+(me?" ✓✓":"")));
    b.onclick=e=>{e.stopPropagation();openMenu(x,dm,b)};r.appendChild(b);m.appendChild(r);pu=x.uid;
  });
}
const fmt=n=>Number(n||0).toLocaleString("ru");
function sup(g){return g.supply>0?"Осталось: "+Math.max(0,g.supply-g.sold)+" из "+g.supply:"Без лимита"}
/* ---- NFT-подарки: редкость, красивая карточка, сделки ---- */
function tier(r){r=Number(r);return r<=3?["Легендарная","t1"]:r<=7?["Эпическая","t2"]:r<=15?["Редкая","t3"]:r<=25?["Необычная","t4"]:["Обычная","t5"]}
function gcard(i){
  const c=el("div","nft");
  if(i.bg&&i.bg.gradient)c.style.background=i.bg.gradient;
  if(i.pattern&&i.pattern.symbol){const pt=el("div","pat",(i.pattern.symbol+" ").repeat(90));pt.setAttribute("aria-hidden","true");c.appendChild(pt)}
  const tr=[i.model,i.bg,i.pattern].filter(Boolean);
  if(tr.length){const mr=Math.min(...tr.map(x=>Number(x.rarity)||100)),t=tier(mr);c.appendChild(el("div","rib "+t[1],t[0]));if(mr<=3)c.classList.add("legend")}
  if(i.model&&i.model.badge)c.appendChild(el("div","bdg",i.model.badge));
  const e=el("div","e",i.emoji);if(i.model&&i.model.mod)e.style.filter=i.model.mod+" drop-shadow(0 6px 10px rgba(0,0,0,.3))";c.appendChild(e);
  c.appendChild(el("div","gn",i.name));
  const nums=[];if(i.serial)nums.push("#"+i.serial+(i.supply>0?" из "+i.supply:""));if(i.price>0)nums.push(fmt(i.price)+" 🪙");
  if(nums.length)c.appendChild(el("div","num",nums.join(" · ")));
  [["Модель",i.model],["Фон",i.bg],["Узор",i.pattern]].forEach(([k,t])=>{
    if(!t)return;const r=el("div","trow");r.appendChild(el("span","tk",k));r.appendChild(el("span","tv",t.name));
    const p=el("span","tr "+tier(t.rarity)[1],t.rarity+"%");p.title=tier(t.rarity)[0]+": выпадает у "+t.rarity+"% подарков";r.appendChild(p);c.appendChild(r);
  });
  if(i.note)c.appendChild(el("div","gnote","«"+i.note+"»"));
  return c;
}
function tradeText(g){
  const n="«"+g.name+"»"+(g.serial?" #"+g.serial:"");
  if(g.type==="sale"){
    if(S.me===g.buyer)return "🛒 Вы купили "+n+" у "+nm(g.seller)+" за "+fmt(g.price)+" 🪙";
    if(S.me===g.seller)return "💰 Вы продали "+n+" пользователю "+nm(g.buyer)+" за "+fmt(g.price)+" 🪙 (комиссия "+fmt(g.fee)+", получено "+fmt(g.payout)+" 🪙)";
    return "🛒 Сделка: "+n+" за "+fmt(g.price)+" 🪙";
  }
  if(S.me===g.to)return "🎁 "+nm(g.from)+" передал(а) вам "+n;
  if(S.me===g.from)return "🎁 Вы передали "+n+" пользователю "+nm(g.to);
  return "🎁 Передача: "+n;
}
function inp(ph,key,w,num){const i=el("input","f");i.placeholder=ph;i.value=S.form[key];i.oninput=()=>S.form[key]=i.value;if(w)i.maxLength=w;if(num){i.type="number";i.min=0;i.inputMode="numeric"}return i}
function sel(key,opts,ph){const s=el("select");s.appendChild(new Option(ph,""));opts.forEach(([v,l])=>s.appendChild(new Option(l,v)));s.value=S.form[key];s.onchange=()=>{S.form[key]=s.value;render(true)};return s}
function fld(label,node){const d=el("div","fld");d.appendChild(el("label","",label));d.appendChild(node);return d}
function fail(e){if(e.status===401)return logout();toast(e.message||"Ошибка");S.err="";render(true)}
/* ежедневный бонус с обратным отсчётом */
const dailyLeft=()=>Math.max(0,(S.lastDaily||0)+864e5-Date.now());
function fmtT(ms){const s=Math.ceil(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":")}
function updDaily(b){const l=dailyLeft();if(l>0){b.disabled=true;b.textContent="Следующий бонус через "+fmtT(l)}else{b.disabled=false;b.textContent="🎁 Забрать ежедневный бонус (+50 🪙)"}}
function dailyBtn(){const b=el("button","p w");b.dataset.daily="1";b.onclick=claimDaily;updDaily(b);return b}
setInterval(()=>document.querySelectorAll("[data-daily]").forEach(updDaily),1000);
async function claimDaily(){
  try{const r=await api("/api/daily",{});S.coins=r.coins;S.lastDaily=r.lastDaily;toast("+"+r.gained+" 🪙 Ежедневный бонус получен");refreshCoins()}
  catch(e){if(e.status===429&&e.data){S.lastDaily=e.data.lastDaily||S.lastDaily;refreshCoins()}fail(e)}
}

function confirmBuy(b,it){
  if(!b.dataset.a){
    b.dataset.a="1";b.textContent="Подтвердить −"+fmt(it.listPrice)+" 🪙";
    setTimeout(()=>{if(b.isConnected&&b.dataset.a){delete b.dataset.a;b.textContent="Купить за "+fmt(it.listPrice)+" 🪙"}},4000);
    return;
  }
  buyLot(it);

// единый способ обновить состояние подарка из ответа сервера или события
function applyItem(it){
  for(const k of Object.keys(S.recv)){
    const a=S.recv[k],j=a.findIndex(x=>x.id===it.id);
    if(j>=0){if(k===it.owner)a[j]=it;else a.splice(j,1)}
  }
  const own=S.recv[it.owner]||(S.recv[it.owner]=[]);
  if(!own.some(x=>x.id===it.id))own.push(it);
  const j=S.market.findIndex(x=>x.id===it.id);
  if(it.listed){if(j>=0)S.market[j]=it;else S.market.unshift(it)}else if(j>=0)S.market.splice(j,1);
}

  side();head();
  const cv=S.view==="chat"||dmv,banLock=S.isBanned&&cv,blk=dmv&&!!S.blocked[peer];
  $("#comp").hidden=!cv||banLock||blk;
  showNote(cv&&banLock?"ban":(blk?"block":""),peer);

  if(S.reply&&S.reply.view!==S.view)S.reply=null;

  const m=$("#main"),near=m.scrollHeight-m.scrollTop-m.clientHeight<80;
  const ae=document.activeElement,keep=(S.view==="shop"||S.view==="admin")?m.scrollTop:null;

  if(S.view==="chat")chat(m,S.msgs,false);
  else if(dmv)chat(m,th.map(x=>x.kind==="trade"&&x.gift?{id:x.id,uid:x.from,type:"trade",gift:x.gift,text:x.text,ts:x.ts}:x.kind==="gift"&&x.gift?{id:x.id,uid:x.from,type:"giftcard",gift:x.gift,text:x.text,ts:x.ts,reply:x.reply}:{id:x.id,uid:x.from,type:"text",text:x.text,ts:x.ts,reply:x.reply}),true);

function placeMenu(){

function compress(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const N=256,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");
      const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
      x.fillStyle="#fff";x.fillRect(0,0,N,N);x.drawImage(img,sx,sy,m,m,0,0,N,N);URL.revokeObjectURL(url);
      let q=.85,d=c.toDataURL("image/jpeg",q);
      while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}
      ok(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error("Не удалось открыть это фото. Выберите JPEG или PNG."))};
    img.src=url;
  });
}

  const go=async()=>{
    const nick=n.value.trim(),pw=p.value;
    if(!nick||(!pw&&!(S.preview&&!reg)))return aerr(S.preview&&!reg?"Введите ник":"Введите ник и пароль");
    if(reg&&pw!==p2.value)return aerr("Пароли не совпадают");
    aerr("…");
    try{const r=await api(reg?"/api/register":"/api/login",{nick,password:pw});TOKEN=r.token;ls.set("tok",TOKEN);S.auth="load";S.err="";showAuth();connect()}
    catch(e){aerr(e.message==="Failed to fetch"?"Нет связи с сервером":e.message)}
  };
  b.onclick=go;c.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
}
function boot(){
  if(!BASE){S.auth="setup";showAuth();return}
  fetch(BASE+"/api/ping").then(r=>r.json()).then(j=>{if(j.preview&&!S.preview){S.preview=true;if(S.auth==="login")showAuth()}}).catch(()=>{});
  if(!TOKEN){S.auth="login";showAuth();return}
  S.auth="load";showAuth();connect();
}
const E=["😀","😂","😍","👍","🙏","🔥","🎉","❤️","😎","🤔","😢","🎁"];
E.forEach(e=>{const s=el("span","",e);s.onclick=()=>{$("#inp").value+=e;$("#inp").focus()};$("#emo").appendChild(s)});
$("#emb").onclick=()=>{$("#emo").hidden=!$("#emo").hidden};
$("#send").onclick=send;
$("#inp").onkeydown=e=>{if(e.key==="Enter")send()};
let lastTyping=0;
$("#inp").addEventListener("input",()=>{
  if(!S.view.startsWith("dm:")||S.auth!=="ok"||S.isBanned||!$("#inp").value.trim())return;
  const to=S.view.slice(3);if(S.blocked[to])return;
  const n=Date.now();if(n-lastTyping<2500)return;lastTyping=n;
  api("/api/typing",{to}).catch(()=>{});   // лёгкое событие «печатает…», ошибки не важны
});
$("#q").oninput=e=>{S.q=e.target.value;side()};
$("#back").onclick=()=>{S.open=false;render()};
boot();
</script>
