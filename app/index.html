<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbogram</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3390ec">
<style>
:root{--pan:#fff;--hov:#f1f3f5;--sel:#3390ec;--tx:#000;--mu:#707579;--ac:#3390ec;--in:#fff;--out:#eeffde;--bd:#e4e6e8;--chat:linear-gradient(160deg,#dbe8c9,#c3d8c4 50%,#b7cfd3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pan:#212121;--hov:#2c2c2c;--sel:#8774e1;--tx:#fff;--mu:#aaa;--ac:#8774e1;--in:#212121;--out:#766ac8;--bd:#303030;--chat:linear-gradient(160deg,#0f0f0f,#16121f);color-scheme:dark}}
:root[data-theme="dark"]{--pan:#212121;--hov:#2c2c2c;--sel:#8774e1;--tx:#fff;--mu:#aaa;--ac:#8774e1;--in:#212121;--out:#766ac8;--bd:#303030;--chat:linear-gradient(160deg,#0f0f0f,#16121f);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--pan);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100%}
#side{width:330px;flex:none;display:flex;flex-direction:column;background:var(--pan);border-right:1px solid var(--bd)}
#pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pan);height:40px}
.top .ic{font-size:22px;color:var(--mu)}
#q{flex:1;background:var(--hov);border:0;border-radius:20px;padding:9px 14px;color:var(--tx);font:inherit;outline:0}
#list{overflow-y:auto;flex:1;padding:0 6px}
.it{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:center}
.it:hover{background:var(--hov)}.it.on{background:var(--sel);color:#fff}.it.on .mu{color:#ffffffcc}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px}
.av.s{width:34px;height:34px;font-size:15px}
.it .b{flex:1;min-width:0}.it .r{display:flex;justify-content:space-between;gap:8px}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:13px}.it .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--pan);border-bottom:1px solid var(--bd);height:44px}
.hd .t{font-weight:600}.hd .back{display:none;font-size:24px;background:none;border:0;color:var(--ac);cursor:pointer;padding:0 6px}
main{flex:1;overflow-y:auto;padding:10px 12px}
.sep{text-align:center;margin:10px 0}.sep span{background:#00000055;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px}
.row{display:flex;margin:2px 0;gap:6px;align-items:flex-end}.row.me{justify-content:flex-end}
.bub{max-width:min(78%,480px);background:var(--in);padding:6px 10px 5px;border-radius:14px;overflow-wrap:anywhere;box-shadow:0 1px 1px #0002;color:var(--tx)}
.row.me .bub{background:var(--out);border-bottom-right-radius:4px}.row:not(.me) .bub{border-bottom-left-radius:4px}
.me .bub{color:var(--tx)}
:root:not([data-theme="light"]) .row.me .bub{color:#fff}
.who{font-size:13px;font-weight:600;color:var(--ac)}
.ts{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--mu)}
.bub.gift{text-align:center;padding:14px 22px;max-width:260px;background:#00000066;color:#fff}
.gift .e{font-size:56px;line-height:1.1}.gift .ts{float:none;display:block;color:#ffffffaa}
.note{background:#00000055;color:#fff;border-radius:12px;padding:6px 12px;margin:8px auto;font-size:13px;max-width:fit-content;text-align:center}
.card{background:var(--pan);border-radius:12px;padding:12px;margin-bottom:12px;max-width:640px;margin-left:auto;margin-right:auto}
.card h2{margin:0 0 8px;font-size:15px}.card .note{background:none;color:var(--mu);padding:0;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.g{background:var(--hov);border-radius:10px;padding:8px;text-align:center;font-size:13px}.g .e{font-size:34px}
footer{padding:8px 10px;display:flex;gap:8px;align-items:flex-end}
.box{flex:1;display:flex;align-items:center;gap:6px;background:var(--pan);border-radius:22px;padding:4px 12px}
.box input{flex:1;border:0;background:none;color:var(--tx);font:inherit;padding:8px 0;outline:0;min-width:0}
.box button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mu);padding:0}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
#emo{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;background:var(--pan);font-size:24px;cursor:pointer}
input.f,select{font:inherit;color:var(--tx);background:var(--hov);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}.fr>*{flex:1 1 120px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.s{background:none;border:0;color:var(--mu);cursor:pointer;font-size:12px;flex:none}
#auth{position:fixed;inset:0;z-index:20;background:var(--chat);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.ac{background:var(--pan);border-radius:16px;padding:22px;width:min(100%,340px);display:flex;flex-direction:column;gap:10px}
.ac h1{margin:0;font-size:20px;text-align:center}.ac .err{color:#e5484d;min-height:18px;font-size:13px}.ac p{margin:0;text-align:center}
.sec{color:var(--ac);font-weight:600;font-size:13px;padding:10px 8px 2px}
.bd2{background:var(--ac);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;text-align:center;font-size:12px;flex:none}
.it .r>.pv{min-width:0}
.quote{border-left:3px solid var(--ac);padding:2px 8px;margin:0 0 4px;border-radius:4px;background:#0000000d;cursor:pointer;font-size:13px}
.quote b{display:block;color:var(--ac);font-weight:600}
.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
.bub{cursor:pointer}.row.flash .bub{animation:fl 1.4s}
@keyframes fl{0%,70%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:0 1px 1px #0002}}
#rbar{display:flex;align-items:center;gap:8px;background:var(--pan);padding:6px 12px;border-top:1px solid var(--bd)}
#rbar .qq{flex:1;min-width:0;border-left:3px solid var(--ac);padding-left:8px;font-size:13px}
#rbar b{display:block;color:var(--ac)}#rbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
#rbar button{font-size:18px}
.menu{position:fixed;z-index:15;background:var(--pan);border-radius:12px;box-shadow:0 4px 20px #0005;padding:4px;display:flex;flex-direction:column;min-width:180px;max-width:260px}
.menu button{background:none;border:0;color:var(--tx);font:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--hov)}.menu .danger{color:#e5484d}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;border-radius:16px;padding:8px 14px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.top .burger{background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer;padding:0 4px;line-height:1}
.top .burger:hover{color:var(--ac)}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xl{width:96px;height:96px;font-size:40px}
.hdc{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who{cursor:pointer}
#dov{position:fixed;inset:0;background:#0007;z-index:24}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:var(--pan);z-index:25;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:4px 0 24px #0005;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#drawer.on{transform:none}
.dh{padding:20px 18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--hov)}
.dh .n{font-weight:600;font-size:17px}.dh .b{font-size:13px;color:var(--mu)}
.dit{display:flex;gap:14px;padding:14px 18px;cursor:pointer;align-items:center;background:none;border:0;color:var(--tx);font:inherit;width:100%;text-align:left}
.dit:hover{background:var(--hov)}.dit.red{color:#e5484d}
.dft{margin-top:auto;padding:14px 18px;color:var(--mu);font-size:12px}
#sov{position:fixed;inset:0;background:#0007;z-index:26;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--pan);width:min(100%,420px);border-radius:16px 16px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
@media(min-width:721px){#sov{align-items:center}.sheet{border-radius:16px}}
.sh-x{position:absolute;right:10px;top:8px;font-size:20px!important}
.sheet h2{margin:0;text-align:center;font-size:20px}.sheet p{margin:0}
.ctr{display:flex;justify-content:center}.ctr2{text-align:center}
.sheet .bio{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--hov);border-radius:10px;padding:10px 12px}
.sheet label{font-size:13px;color:var(--mu)}
.sheet textarea,.sheet input.f{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--hov);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.sheet textarea{resize:none;height:84px}
.sheet .fr{margin:0}.err{color:#e5484d;font-size:13px;min-height:16px}.ok{color:#3aa655;font-size:13px}
button.p.w{width:100%}button.g2{background:var(--hov);color:var(--tx);border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
.gc{background:linear-gradient(135deg,#7c6cf022,#ff7eb322);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;text-align:center}
.gc .e{font-size:54px;line-height:1.1}.gc .gn{font-weight:700;margin-top:2px}.gc .gm{color:var(--mu);font-size:13px;margin-top:2px}
.gc .gnote{font-style:italic;margin-top:6px;font-size:14px}.gc .gfrom{font-size:11px;color:var(--mu);margin-top:4px}
.bub.gift2{padding:8px;min-width:210px}.gift2 .gh{font-size:13px;margin:2px 4px 6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pgrid .gc{padding:8px}.pgrid .gc .e{font-size:34px}.pgrid .gc .gn{font-size:13px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:640px;margin:0 auto 12px}
.sg{background:var(--pan);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.sg .e{font-size:46px;line-height:1.1}.sg .gn{font-weight:600}.sg .pr{font-weight:700}
.sg .lf{font-size:13px;color:var(--mu)}.sg .lf.low{color:#e5484d}.sg button{margin-top:auto}.sg.out{opacity:.65}
.bal{font-size:15px;margin-bottom:8px}.bal b{font-size:20px}
.dbal{font-size:15px;font-weight:600;margin-top:2px}
.fld{margin:6px 0}.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.fld input,.fld select{width:100%;box-sizing:border-box}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px;color:var(--tx)}
button.p:disabled{opacity:.5;cursor:default}
.crow{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px}.crow .t{flex:1;min-width:0}.crow .mu{font-size:12px}
.fr>.fld{flex:1 1 120px;margin:0}
[hidden]{display:none!important}
@media(max-width:720px){#side{width:100%;border:0}#pane{display:none}#app.open #side{display:none}#app.open #pane{display:flex}.hd .back{display:block}}
</style>
</head>
<body>
<div id="auth"><div class="ac"><p class="mu">Подключение…</p></div></div>
<div id="app">
<aside id="side"><div class="top"><button class="burger" id="burger" title="Меню">☰</button><input id="q" placeholder="Поиск по нику" autocomplete="off"></div><div id="list"></div></aside>
<section id="pane">
<div class="hd"><button class="back" id="back">‹</button><div class="hdc" id="hdc"><div id="hav"></div><div><div class="t" id="ht"></div><div class="mu" id="hs"></div></div></div></div>
<main id="main"></main>
<div id="emo" hidden></div>
<div id="rbar" hidden></div>
<footer id="comp"><div class="box"><button id="emb" title="Эмодзи">☺</button><input id="inp" placeholder="Написать сообщение…" maxlength="1000" autocomplete="off"></div><button id="send" title="Отправить"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-6.8l11-1.7-11-1.7V3.5L22 12z"/></svg></button></footer>
</section>
</div>
<div id="dov" hidden></div>
<aside id="drawer"></aside>
<div id="sov" hidden><div class="sheet" id="sheet"></div></div>
<div class="menu" id="menu" hidden></div><div class="toast" id="toast" hidden></div>
<script>
const S={coins:0,lastDaily:0,armed:"",dirty:false,preview:false,U:{},view:"chat",open:false,q:"",reply:null,msgs:[],dms:[],read:{},gifts:[],members:[],recv:{},nick:{},me:null,owner:false,auth:"load",mode:"login",err:"",form:{emoji:"🎁",name:"",price:"",supply:"",cnick:"",camt:"",to:"",note:"",free:false}};
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function nm(id){return S.nick[id]||"Участник"}
function ini(id){const n=S.nick[id];return n?n[0].toUpperCase():"?"}
function tm(ts){try{return new Date(ts).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function dy(ts){const d=new Date(ts),n=new Date(),y=new Date(n-864e5);if(d.toDateString()===n.toDateString())return"Сегодня";if(d.toDateString()===y.toDateString())return"Вчера";return d.toLocaleDateString("ru",{day:"numeric",month:"long"})}
function pl(n,a,b,c){const m=n%10,h=n%100;return n+" "+(m==1&&h!=11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c))}
function hs(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function av(id,txt,sm,bg){
  const d=el("div","av"+(sm?" s":""),txt);d.style.background=bg||`hsl(${hs(id)%360} 50% 48%)`;
  const u=S.U[id];
  if(u&&u.av&&!bg){const i=new Image();i.alt="";i.onerror=()=>i.remove();i.src=BASE+"/api/avatar/"+id+"?v="+u.av;d.appendChild(i)}
  return d;
}
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const isApp=!!window.Capacitor;
let BASE=ls.get("srv")||(isApp?"":location.origin),TOKEN=ls.get("tok"),es=null;
async function api(p,b){
  const r=await fetch(BASE+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,token:TOKEN})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||("Ошибка "+r.status));e.status=r.status;e.data=j;throw e}
  return j;
}
function thread(u){return S.dms.filter(m=>m.from===u||m.to===u)}
function unread(u){const r=S.read[u]||0;return S.dms.filter(m=>m.from===u&&m.ts>r).length}
function side(){
  const l=$("#list");l.textContent="";
  const last=S.msgs[S.msgs.length-1],mine=(S.recv[S.me]||[]).length;
  let pv="Нет сообщений";
  if(last)pv=last.type==="gift"?"🎁 "+last.gname:(last.uid===S.me?"Вы: ":nm(last.uid)+": ")+(last.text||"");
  const sys=[{k:"chat",c:"#3390ec",ic:"💬",t:"Общий чат",pv,tm:last?tm(last.ts):""},{k:"shop",c:"#e17076",ic:"🎁",t:"Магазин подарков",pv:"Баланс: "+fmt(S.coins)+" 🪙"}];
  if(S.owner)sys.push({k:"admin",c:"#7bc862",ic:"⚙",t:"Админ",pv:"Подарки и монеты"});
  const q=S.q.trim().toLowerCase();let n=0;
  const add=i=>{
    n++;const d=el("div","it"+(S.view===i.k?" on":""));
    d.appendChild(i.uid?av(i.uid,ini(i.uid)):av(i.k,i.ic,0,i.c));
    const b=el("div","b"),r=el("div","r");r.appendChild(el("div","t",i.t));r.appendChild(el("div","mu",i.tm||""));b.appendChild(r);
    const r2=el("div","r");r2.appendChild(el("div","mu pv",i.pv));if(i.un&&S.view!==i.k)r2.appendChild(el("div","bd2",String(i.un)));
    b.appendChild(r2);d.appendChild(b);
    d.onclick=()=>{S.view=i.k;S.open=true;if(i.uid){S.q="";$("#q").value=""}render(true)};l.appendChild(d);
  };
  sys.filter(i=>!q||i.t.toLowerCase().includes(q)).forEach(add);
  const dial={};S.dms.forEach(m=>{const o=m.from===S.me?m.to:m.from;if(!dial[o]||m.ts>=dial[o].ts)dial[o]=m});
  const U=id=>{const d=dial[id];return{k:"dm:"+id,uid:id,t:nm(id),pv:d?(d.from===S.me?"Вы: ":"")+d.text:"Написать сообщение",tm:d?tm(d.ts):"",un:unread(id)}};
  if(!q){Object.keys(dial).sort((a,b)=>dial[b].ts-dial[a].ts).forEach(id=>add(U(id)))}
  else{
    const f=S.members.filter(id=>id!==S.me&&nm(id).toLowerCase().includes(q));
    if(f.length){l.appendChild(el("div","sec","Пользователи"));f.forEach(id=>add(U(id)))}
    if(!n)l.appendChild(el("div","sec","Никого не найдено"));
  }
}
function head(){
  let T;if(S.view.startsWith("dm:")){const id=S.view.slice(3);T=[ini(id),`hsl(${hs(id)%360} 50% 48%)`,nm(id),"личные сообщения"]}else T={chat:["💬","#3390ec","Общий чат",pl(S.members.length,"участник","участника","участников")],shop:["🎁","#e17076","Магазин подарков","Баланс: "+fmt(S.coins)+" 🪙"],admin:["⚙","#7bc862","Админ","Только для владельца"]}[S.view];
  const dmId=S.view.startsWith("dm:")?S.view.slice(3):null;
  const a=$("#hav");a.textContent="";a.appendChild(dmId?av(dmId,ini(dmId),1):av("h",T[0],1,T[1]));$("#ht").textContent=T[2];$("#hs").textContent=T[3];
  const hc=$("#hdc");hc.style.cursor=dmId?"pointer":"default";hc.onclick=dmId?()=>openProfile(dmId):null;
}
function chat(m,list,dm){
  if(S.err)m.appendChild(el("div","note",S.err));
  if(!list.length)m.appendChild(el("div","note",dm?"Диалог пока пуст. Напишите первым!":"Пока пусто. Напишите первое сообщение!"));
  let pd="",pu=null;
  list.forEach(x=>{
    const d=dy(x.ts);if(d!==pd){const s=el("div","sep");s.appendChild(el("span","",d));m.appendChild(s);pd=d;pu=null}
    const me=x.uid===S.me,r=el("div","row"+(me?" me":""));r.dataset.id=x.id;
    if(!me&&!dm)r.appendChild(pu===x.uid&&x.type!=="gift"?el("div","av s"):pav(x.uid));
    const b=el("div","bub");
    if(!me&&!dm&&pu!==x.uid){const w=el("div","who",nm(x.uid));w.onclick=e=>{e.stopPropagation();openProfile(x.uid)};b.appendChild(w)}
    if(x.reply){const q=el("div","quote");q.appendChild(el("b","",x.reply.uid===S.me?"Вы":nm(x.reply.uid)));q.appendChild(el("span","",x.reply.text||"…"));q.onclick=e=>{e.stopPropagation();jump(x.reply.id)};b.appendChild(q)}
    if(x.type==="giftcard"&&x.gift){b.classList.add("gift2");b.appendChild(el("div","gh",me?"🎁 Вы отправили подарок":"🎁 "+nm(x.uid)+" дарит вам подарок"));b.appendChild(gcard(x.gift))}
    else if(x.type==="gift"){b.classList.add("gift");b.appendChild(el("div","e",x.emoji||"🎁"));b.appendChild(el("div","",nm(x.uid)+" дарит «"+(x.gname||"")+"» · "+nm(x.to)))}
    else b.appendChild(el("span","",x.text||""));
    b.appendChild(el("span","ts",tm(x.ts)+(me?" ✓✓":"")));
    b.onclick=e=>{e.stopPropagation();openMenu(x,dm,b)};r.appendChild(b);m.appendChild(r);pu=x.uid;
  });
}

function compress(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const N=256,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");
      const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
      x.fillStyle="#fff";x.fillRect(0,0,N,N);x.drawImage(img,sx,sy,m,m,0,0,N,N);URL.revokeObjectURL(url);
      let q=.85,d=c.toDataURL("image/jpeg",q);
      while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}
      ok(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error("Не удалось открыть это фото. Выберите JPEG или PNG."))};
    img.src=url;
  });
}

    const bio=el("textarea");bio.value=u.bio;bio.maxLength=200;bio.placeholder="Расскажите о себе";s.appendChild(bio);
    const cnt=el("div","mu","");cnt.style.textAlign="right";const upd=()=>cnt.textContent=bio.value.length+"/200";upd();bio.oninput=upd;s.appendChild(cnt);
    const e1=el("div","err");s.appendChild(e1);
    const save=el("button","p w","Сохранить");s.appendChild(save);
    save.onclick=async()=>{
      const body={},nv=n.value.trim(),bv=bio.value.trim();
      if(nv!==u.nick)body.nick=nv;
      if(bv!==u.bio)body.bio=bv;
      if(pend!==undefined)body.avatar=pend;
      if(!Object.keys(body).length)return closeSheet();
      e1.className="mu";e1.textContent="Сохраняю…";save.disabled=true;
      try{const r=await api("/api/profile",body);setU(r.me);render();closeSheet();toast("Профиль сохранён")}
      catch(e){if(e.status===401)return logout();save.disabled=false;pe(e.message==="Failed to fetch"?"Нет связи с сервером":e.message)}
    };
  },"edit",S.me);
}
function applyTheme(v){if(v==="light"||v==="dark")document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}
function openSettings(){
  closeDrawer();
  sheet(s=>{
    s.appendChild(el("h2","","Настройки"));
    s.appendChild(el("label","","Тема оформления"));
    const t=el("select");[["","Как в системе"],["light","Светлая"],["dark","Тёмная"]].forEach(([v,l])=>t.appendChild(new Option(l,v)));
    t.value=ls.get("theme");t.onchange=()=>{ls.set("theme",t.value);applyTheme(t.value)};s.appendChild(t);
    s.appendChild(el("label","","Сервер"));
    s.appendChild(el("p","mu",BASE||"не задан"));
    const b=el("button","g2","Сменить сервер");b.onclick=()=>{closeSheet();if(es){es.close();es=null}S.auth="setup";showAuth()};s.appendChild(b);
  },"set");
}
$("#burger").onclick=openDrawer;
$("#dov").onclick=closeDrawer;
$("#sov").onclick=e=>{if(e.target.id==="sov")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeSheet()}});
applyTheme(ls.get("theme"));
/* ---- подключение к серверу ---- */
function connect(){
  if(es)es.close();
  es=new EventSource(BASE+"/api/events?token="+encodeURIComponent(TOKEN));
  const on=(n,f)=>es.addEventListener(n,e=>f(JSON.parse(e.data)));
  on("init",d=>{S.me=d.me.id;S.owner=d.me.owner;S.U={};S.nick={};S.members=d.members.map(m=>{setU(m);return m.id});S.coins=d.me.coins||0;S.lastDaily=d.me.lastDaily||0;S.gifts=d.gifts;S.recv=d.received;S.msgs=d.messages;S.dms=d.dms||[];try{S.read=JSON.parse(ls.get("rd:"+S.me)||"{}")}catch(e){S.read={}}S.err="";S.auth="ok";showAuth();render(true)});
  on("msg",m=>{S.msgs.push(m);if(S.msgs.length>300)S.msgs.shift();render()});
  on("dm",m=>{S.dms.push(m);render()});
  on("del",d=>{if(d.kind==="dm")S.dms=S.dms.filter(x=>x.id!==d.id);else S.msgs=S.msgs.filter(x=>x.id!==d.id);if(S.reply&&S.reply.id===d.id)S.reply=null;if(menuFor===d.id)closeMenu();render()});
  on("member",m=>{if(!S.U[m.id])S.members.push(m.id);setU(m);render()});
  on("profile",m=>{setU(m);render();if(!$("#sov").hidden&&sheetMode==="view"&&sheetFor===m.id)openProfile(m.id);if($("#drawer").classList.contains("on"))openDrawer()});
  on("gift",g=>{const i=S.gifts.findIndex(x=>x.id===g.id);if(i>=0)S.gifts[i]=g;else S.gifts.push(g);render()});
  on("coins",d=>{S.coins=d.coins;if(d.lastDaily)S.lastDaily=d.lastDaily;refreshCoins()});
  on("giftdel",d=>{S.gifts=S.gifts.filter(g=>g.id!==d.id);render()});
  on("received",d=>{(S.recv[d.to]=S.recv[d.to]||[]).push(d.item);render();if(!$("#sov").hidden&&sheetMode==="view"&&sheetFor===d.to)openProfile(d.to);if(d.to===S.me)toast("🎁 "+nm(d.item.from)+" дарит вам «"+d.item.name+"»")});
  es.onerror=async()=>{
    try{const r=await fetch(BASE+"/api/me?token="+encodeURIComponent(TOKEN));if(r.status===401)return logout()}
    catch(e){}
    S.err="Нет связи с сервером. Переподключаюсь…";
    if(S.auth==="ok")render();else showAuth();
  };
}
function logout(){
  closeDrawer();closeSheet();
  if(es){es.close();es=null}
  if(TOKEN)fetch(BASE+"/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN})}).catch(()=>{});
  TOKEN="";ls.set("tok","");S.auth="login";S.err="";S.msgs=[];S.dms=[];S.view="chat";first=true;showAuth();
}
/* ---- экраны входа ---- */
function field(ph,type,id){const i=el("input","f");i.placeholder=ph;i.type=type||"text";i.id=id;i.autocomplete="off";i.autocapitalize="off";return i}
function aerr(t){const e=$("#aerr");if(e)e.textContent=t||""}
function showAuth(){
  const a=$("#auth");
  if(S.auth==="ok"){a.hidden=true;return}
  a.hidden=false;a.textContent="";const c=el("div","ac");a.appendChild(c);
  const srv=()=>{const b=el("button","s","Сервер: "+(BASE||"не задан")+" (сменить)");b.onclick=()=>{S.auth="setup";showAuth()};c.appendChild(b)};
  if(S.auth==="load"){c.appendChild(el("p","mu",S.err||"Подключение…"));srv();return}
  if(S.auth==="setup"){
    c.appendChild(el("h1","","Сервер"));
    c.appendChild(el("p","mu","Адрес вашего сервера, например https://chat.example.com"));
    const f=field("https://…","url","su");f.value=BASE;c.appendChild(f);
    c.appendChild(el("div","err","")).id="aerr";
    const b=el("button","p","Продолжить");c.appendChild(b);
    const go=async()=>{
      let u=f.value.trim().replace(/\/+$/,"");if(!u)return;if(!/^https?:\/\//.test(u))u="http://"+u;
      aerr("Проверяю…");
      try{const r=await fetch(u+"/api/ping");if(!r.ok)throw 0;BASE=u;ls.set("srv",u);aerr("");boot()}
      catch(e){aerr("Сервер не отвечает по этому адресу")}
    };
    b.onclick=go;f.onkeydown=e=>{if(e.key==="Enter")go()};return;
  }
  const reg=S.auth==="register";
  c.appendChild(el("h1","","Turbogram"));c.appendChild(el("p","mu",reg?"Регистрация":"Вход"));
  const n=field("Ник","text","an"),p=field("Пароль","password","ap");c.appendChild(n);c.appendChild(p);
  if(S.preview&&!reg){p.placeholder="Пароль (в предпросмотре не нужен)";c.appendChild(el("p","mu","Режим предпросмотра: пароль не проверяется"))}
  let p2;if(reg){p2=field("Повторите пароль","password","ap2");c.appendChild(p2)}
  c.appendChild(el("div","err","")).id="aerr";
  const b=el("button","p",reg?"Зарегистрироваться":"Войти");c.appendChild(b);
  const sw=el("button","s",reg?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться");sw.onclick=()=>{S.auth=reg?"login":"register";showAuth()};c.appendChild(sw);
  if(reg)c.appendChild(el("p","mu","Ник уникален: занятый ник другой пользователь взять не сможет."));
  srv();
  const go=async()=>{
    const nick=n.value.trim(),pw=p.value;
    if(!nick||(!pw&&!(S.preview&&!reg)))return aerr(S.preview&&!reg?"Введите ник":"Введите ник и пароль");
    if(reg&&pw!==p2.value)return aerr("Пароли не совпадают");
    aerr("…");
    try{const r=await api(reg?"/api/register":"/api/login",{nick,password:pw});TOKEN=r.token;ls.set("tok",TOKEN);S.auth="load";S.err="";showAuth();connect()}
    catch(e){aerr(e.message==="Failed to fetch"?"Нет связи с сервером":e.message)}
  };
  b.onclick=go;c.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});
}
function boot(){
  if(!BASE){S.auth="setup";showAuth();return}
  fetch(BASE+"/api/ping").then(r=>r.json()).then(j=>{if(j.preview&&!S.preview){S.preview=true;if(S.auth==="login")showAuth()}}).catch(()=>{});
  if(!TOKEN){S.auth="login";showAuth();return}
  S.auth="load";showAuth();connect();
}
const E=["😀","😂","😍","👍","🙏","🔥","🎉","❤️","😎","🤔","😢","🎁"];
E.forEach(e=>{const s=el("span","",e);s.onclick=()=>{$("#inp").value+=e;$("#inp").focus()};$("#emo").appendChild(s)});
$("#emb").onclick=()=>{$("#emo").hidden=!$("#emo").hidden};
$("#send").onclick=send;
$("#inp").onkeydown=e=>{if(e.key==="Enter")send()};
$("#q").oninput=e=>{S.q=e.target.value;side()};
$("#back").onclick=()=>{S.open=false;render()};
boot();
</script>
